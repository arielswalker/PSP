name: "CodeQL Analysis"

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  codeql:
    name: Codeql
    uses: arielswalker/cFS/.github/workflows/codeql-reusable.yml@test-cfs/workflows136
    with:
      component-path: psp
      prep: 'make prep'
      make: 'ls -a; pwd; make -C build/native/default_cpu1/psp'
